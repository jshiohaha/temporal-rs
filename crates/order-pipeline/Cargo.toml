[package]
name = "order-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
temporalio-sdk.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-macros.workspace = true
temporalio-workflow.workspace = true
futures.workspace = true

tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "order-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "order-starter"
path = "src/bin/starter.rs"

[dev-dependencies]
# The `testing` feature gives you `ActivityEnvironment` (run activities directly,
# no server) and `WorkflowEnvironment` (spins up an ephemeral dev server).
temporalio-sdk = { workspace = true, features = ["testing"] }
